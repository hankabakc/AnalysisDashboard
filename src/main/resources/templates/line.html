<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/layout :: head('Hat ' + ${lineId} + ' - Analysis Dashboard')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar('dashboard')}"></nav>

<main class="container-fluid px-4 py-3">
    <!-- Sayfa Başlığı ve Panoya Dönüş Butonu -->
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
        <h1 class="h3 fw-bold mb-0" th:text="'Hat ' + ${lineId}">Hat 1</h1>
        <a th:href="@{/dashboard(range=${periodFilter.range}, day=${periodFilter.day}, shift=${periodFilter.shift})}" class="btn btn-outline-secondary">
            🏭 Panoya Dön
        </a>
    </div>

    <!-- Filtreleme Çubuğu: tazelenmez (yazılan arama metni kaybolmasın). Yeni arama ilk sayfadan başlar,
         sıralama, sayfa boyutu ve dönem korunur. -->
    <div class="card shadow-sm border bg-white mb-4">
        <div class="card-body p-3">
            <form method="get" th:action="@{/line/{id}(id=${lineId})}" class="row g-2 align-items-center">
                <input type="hidden" name="sort" th:value="${pageQuery.sort}" />
                <input type="hidden" name="size" th:value="${pageQuery.size}" />
                <!-- Dönem panoda seçilir; arama onu korur -->
                <input type="hidden" name="range" th:value="${periodFilter.range}" />
                <input type="hidden" name="day" th:value="${periodFilter.day}" />
                <input type="hidden" name="shift" th:value="${periodFilter.shift}" />
                <th:block th:replace="~{fragments/barcode-list :: filterFields}"></th:block>
                <div class="col-12 col-sm-auto d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Ara</button>
                    <a th:href="@{/line/{id}(id=${lineId}, range=${periodFilter.range}, day=${periodFilter.day}, shift=${periodFilter.shift})}" class="btn btn-outline-secondary">Temizle</a>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: staleBanner}"></div>

    <!-- Tazelenen alan: aynı filtre ve sayfayla /fragments/line/{id} çekilir -->
    <div th:hx-get="@{/fragments/line/{id}(id=${lineId}, barcodeQuery=${filter.barcodeQuery}, status=${filter.status}, errorCode=${filter.errorCode}, range=${periodFilter.range}, day=${periodFilter.day}, shift=${periodFilter.shift}, size=${pageQuery.size}, sort=${pageQuery.sort}, page=${pageQuery.page})}"
         hx-trigger="refresh" hx-swap="innerHTML" hx-sync="this:drop">
        <div th:replace="~{fragments/barcode-table :: barcodeTable}"></div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: refreshScripts}"></th:block>
</body>
</html>
