<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/layout :: head('Üretim Panosu - Analysis Dashboard')}"></head>
<body class="bg-light">
<th:block th:unless="${tv}">
    <nav th:replace="~{fragments/layout :: navbar('dashboard')}"></nav>
</th:block>
<!-- TV (kiosk) modu: yazı büyür, hat kartları ekrana yayılır. Stil yalnızca bu görünümde yüklenir. -->
<link th:if="${tv}" rel="stylesheet" th:href="@{/css/tv.css}" />

<main class="container-fluid px-4" th:classappend="${tv} ? 'pt-3'">
    <!-- TV başlığı: menü yerine tek satır; saat, veri alanındaki "Son güncelleme"dir (5 sn'de bir tazelenir) -->
    <div th:if="${tv}" class="d-flex justify-content-between align-items-baseline mb-2">
        <h1 class="h3 fw-bold mb-0">🏭 Üretim Panosu</h1>
        <a th:href="@{/dashboard}" class="small text-muted">TV modundan çık</a>
    </div>

    <!-- Dönem seçimi (tazelenmez; seçim adreste taşınır). Hazır dönemler göreli bağlantılardır ve gün seçimini bırakır;
         geçmişe bakmak için gün + vardiya formu. Hat kartları seçili dönemi hat sayfasına taşır. -->
    <div th:unless="${tv}" class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <nav class="btn-group" aria-label="Hazır dönemler">
            <a th:with="active=${periodFilter.day == null and periodFilter.range == 'shift'}"
               th:href="@{/dashboard(range='shift')}"
               th:class="${active} ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary'"
               th:attr="aria-current=${active} ? 'true' : null">Bu vardiya</a>
            <a th:with="active=${periodFilter.day == null and periodFilter.range == 'today'}"
               th:href="@{/dashboard(range='today')}"
               th:class="${active} ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary'"
               th:attr="aria-current=${active} ? 'true' : null">Bugün</a>
            <a th:with="active=${periodFilter.day == null and periodFilter.range == 'all'}"
               th:href="@{/dashboard(range='all')}"
               th:class="${active} ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-primary'"
               th:attr="aria-current=${active} ? 'true' : null">Tüm zamanlar</a>
        </nav>
        <form method="get" th:action="@{/dashboard}" class="d-flex flex-wrap align-items-center gap-2" aria-label="Gün ve vardiya seçimi">
            <input type="date" name="day" required="required" class="form-control form-control-sm w-auto" aria-label="Gün"
                   th:value="${periodFilter.day}" />
            <select name="shift" class="form-select form-select-sm w-auto" aria-label="Vardiya">
                <option value="" th:selected="${periodFilter.shift == null}">Tüm gün</option>
                <option th:each="s, it : ${shifts}" th:value="${it.count}" th:text="${s}"
                        th:selected="${periodFilter.shift == it.count}">1. vardiya (08:00–16:00)</option>
            </select>
            <button type="submit" class="btn btn-sm btn-outline-primary">Göster</button>
        </form>
        <!-- Sahadaki ekran her zaman bu vardiyayı gösterir -->
        <a th:href="@{/dashboard(tv=true)}" class="btn btn-sm btn-outline-secondary ms-auto">
            <span aria-hidden="true">📺</span> TV modu
        </a>
    </div>

    <div th:replace="~{fragments/layout :: staleBanner}"></div>

    <!-- Tazelenen alan: refresh.js "refresh" olayını tetikler, htmx içeriği aynı dönemle /fragments/dashboard'dan çeker -->
    <div th:hx-get="@{/fragments/dashboard(range=${periodFilter.range}, day=${periodFilter.day}, shift=${periodFilter.shift})}"
         hx-trigger="refresh" hx-swap="innerHTML" hx-sync="this:drop">
        <div th:replace="~{fragments/dashboard-data :: dashboardData}"></div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: refreshScripts}"></th:block>
</body>
</html>
