<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/layout :: head('Üretim Panosu - Analysis Dashboard')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid px-4">
    <div th:replace="~{fragments/layout :: staleBanner}"></div>

    <!-- Tazelenen alan: refresh.js "refresh" olayını tetikler, htmx içeriği /fragments/dashboard ile değiştirir -->
    <div th:hx-get="@{/fragments/dashboard}" hx-trigger="refresh" hx-swap="innerHTML" hx-sync="this:drop">
        <div th:replace="~{fragments/dashboard-data :: dashboardData}"></div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: refreshScripts}"></th:block>
</body>
</html>
