<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head th:replace="~{fragments/layout :: head('Üretim Panosu - Analysis Dashboard')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container-fluid px-4">
    <!-- Boş Durum: PLC Yoksa -->
    <div th:if="${plc == null}" class="alert alert-info shadow-sm" role="status">
        Tanımlı PLC bulunamadı.
    </div>

    <!-- PLC ve Hat Bilgisi -->
    <div th:if="${plc != null}">
        <!-- PLC Kartı -->
        <section class="card shadow-sm border mb-4 bg-white" aria-label="PLC Bilgisi">
            <div class="card-body d-flex justify-content-between align-items-center py-3">
                <div class="d-flex align-items-center gap-3">
                    <span class="fw-bold text-muted text-uppercase">PLC</span>
                    <span class="h4 card-title fw-bold text-dark mb-0" th:text="${plc.id}">192.168.1.181</span>
                </div>
                <span class="badge bg-secondary fs-6 py-2 px-3" th:text="${plc.status}">ACTIVE</span>
            </div>
        </section>

        <!-- Hat Kartları -->
        <section aria-label="Üretim Hatları">
            <div class="d-flex flex-row flex-nowrap overflow-auto gap-3 pb-3">
                <a th:each="line : ${lines}"
                   th:href="@{/line/{id}(id=${line.lineId})}"
                   class="card flex-shrink-0 shadow-sm border bg-white text-decoration-none text-reset"
                   style="width: 240px; min-width: 220px;">
                    <div class="card-body p-3 text-center d-flex flex-column justify-content-between">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="h5 card-title fw-bold text-dark mb-0" th:text="${line.lineId}">1</h4>
                            <span class="badge bg-secondary py-1 px-2" th:text="${line.status}">RUN</span>
                        </div>
                        <div class="my-3 py-2 bg-light rounded border">
                            <div class="text-muted small mb-1">Toplam Üretim</div>
                            <div class="display-6 fw-bold text-dark" th:text="${line.quantity}">1319</div>
                            <small class="text-muted">Adet Barkod</small>
                        </div>
                    </div>
                </a>
            </div>
        </section>
    </div>
</main>
</body>
</html>
