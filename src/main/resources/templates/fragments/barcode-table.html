<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<!--
  Hat sayfasinin tazelenen veri alani: calisma durumu (durus analizi), saatlik uretim, hattin ERP hata dagilimi ve
  barkod listesi (kayit sayisi, tablo, sayfalayici: barcode-list ile ortak).
  Hem /line/{id} sayfasi hem /fragments/line/{id} tazeleme ucu bu fragment'i cizer.
  Model: lineId, filter, pageQuery, periodFilter, period, barcodes (Page<BarcodeRow>), errorCounts,
  downtime, hourly.
-->
<body>
<div th:fragment="barcodeTable">
    <section th:replace="~{fragments/downtime :: downtime}"></section>
    <section th:replace="~{fragments/hourly :: hourly}"></section>
    <section th:replace="~{fragments/error-counts :: errorCounts(${lineId})}"></section>

    <div th:replace="~{fragments/barcode-list :: barcodeList(listPath=${'/line/' + lineId}, csvPath=${'/line/' + lineId + '/barcodes.csv'}, showLine=false)}"></div>
</div>
</body>
</html>
