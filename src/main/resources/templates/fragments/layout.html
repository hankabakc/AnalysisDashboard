<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Ortak iskelet. Tum sayfalar head'i buradan alir; sayfalarda kopyalanmaz.
  Varliklar pakete gomulu WebJar'lardan gelir, dis CDN kullanilmaz.
-->
<head th:fragment="head(baslik)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${baslik}">Analysis Dashboard</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
</head>

<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            🏭 Analysis Dashboard
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" th:href="@{/dashboard}">Üretim Panosu</a>
        </div>
        <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
            <span class="text-light me-3">
                👤 <span sec:authentication="name" class="fw-semibold"></span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Çıkış Yap</button>
            </form>
        </div>
    </div>
</nav>

<!--
  "Veriler guncel degil" uyarisi. refresh.js gosterir/gizler; yalnizca renkle degil metinle de uyarir.
  Not: bu elemana d-flex gibi display siniflari verilmez, yoksa "hidden" ozniteligi calismaz.
-->
<div th:fragment="staleBanner" id="stale-banner" class="alert alert-warning shadow-sm" role="status" hidden="hidden">
    <span aria-hidden="true">⚠️</span>
    <strong>Veriler güncel değil.</strong>
    <span id="stale-seconds">0</span> saniyedir sunucudan yanıt alınamıyor; ekrandaki son bilinen durumdur.
</div>

<!--
  Periyodik tazeleme betikleri: yalnizca tazelenen sayfalar (pano, hat) ekler.
  Ayarlar sunucudan (RefreshSettings) gelir; model "refresh" icermelidir.
-->
<th:block th:fragment="refreshScripts">
    <script defer="defer" th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}"></script>
    <script defer="defer" th:src="@{/js/refresh.js}"
            th:data-refresh-ms="${refresh.intervalMs()}"
            th:data-stale-ms="${refresh.staleMs()}"
            th:data-timeout-ms="${refresh.timeoutMs()}"></script>
</th:block>
</body>
</html>
