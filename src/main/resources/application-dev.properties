# Gelistirme profili: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Bilinen parolali gelistirme kullanicilarini (admin, user, apiuser) ekler. Canli ortamda bu profil ACILMAZ.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Sahte PLC toplayici (dev/CollectorSimulator): 5 sn'de bir kalp atisi, hat durumu ve SIM barkodlari yazar.
# Acilista son 30 gunun gecmisini bir kez uretir (ilk acilista birkac saniye surer). Yalnizca yerel veritabanina
# karsi calisir. Durgun ornek veriye bakmak icin false yapin.
# Temizlik (once loglar; gecmis dahil):
#   DELETE FROM line_log WHERE proc_date >= (SELECT min(cre_date) - interval '1 hour' FROM barcode_data WHERE barcode LIKE 'SIM%');
#   DELETE FROM plc_log  WHERE proc_date >= (SELECT min(cre_date) - interval '1 hour' FROM barcode_data WHERE barcode LIKE 'SIM%');
#   DELETE FROM barcode_data WHERE barcode LIKE 'SIM%';
dashboard.simulator.enabled=true
