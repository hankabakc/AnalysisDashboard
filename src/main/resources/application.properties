spring.application.name=Analysis Dashboard

# PostgreSQL baglantisi (Docker: gb-postgres, host portu 5435). Parola yalnizca ortam degiskeninden okunur.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5435}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
# validate: ORM semayi yalnizca kontrol eder, uretmez/degistirmez. Semayi Flyway migrasyonlari kurar
spring.jpa.hibernate.ddl-auto=validate
# open-in-view=false: sablon render'inda gizli lazy sorgu (N+1) olusmasini engeller
spring.jpa.open-in-view=false

# Hata sayfasi mesaj ve yigin izi sizdirmaz
server.error.include-stacktrace=never
server.error.include-message=never

# Yanit sikistirma
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript

# Pano tazeleme: veri alanlari 5 sn'de bir sunucudan yeniden cekilir.
# 3 aralik (15 sn) boyunca basarili yanit gelmezse ekran "Veriler guncel degil" diye isaretlenir.
# Aralik ekran sayisiyla carpilan bir yuktur (5 sn x 20 ekran = saniyede 4 istek); dusurmeden once hesaplayin.
dashboard.refresh.interval=5s
dashboard.refresh.stale-after-intervals=3

# Kaynak sistem sagligi. Toplayici plc_info.last_status_date'i ~5 sn'de bir gunceller:
# son sinyal 60 sn'den eskiyse panoda "toplayicidan veri gelmiyor" uyarisi cikar.
# NEW -> SENT/ERROR normalde birkac saniye surer: 5 dk'dan uzun bekleyen barkod "takildi" sayilir.
dashboard.source.silent-after=60s
dashboard.source.stuck-after=5m

# Vardiya baslangiclari (fabrikanin yerel saati, HH:mm). Ilk saat uretim gununun basidir; sonrakiler gun
# icindeki sirayla yazilir. 00:00 vardiyasi ertesi takvim gununun gecesidir: 08-16, 16-00, 00-08.
dashboard.shift.starts=08:00,16:00,00:00

# Saglik ucu: BT izleme ve konteyner saglik kontrolu icin /actuator/health.
# Herkes yalnizca durumu (UP/DOWN) gorur; veritabani/disk ayrintilari yalnizca ADMIN'e (ic sistem bilgisi sizmaz).
# Metrik ucu: /actuator/prometheus, HTTP Basic ile yalnizca ADMIN/APIUSER (SecurityConfig). Baska actuator ucu acik degil.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Canli ortamda ilk yonetici: etkin ADMIN yoksa bu parolayla "admin" acilir (en az 12 karakter). Yalnizca ortam
# degiskeninden; hesap acildiktan sonra degisken kaldirilir ve parola Kullanicilar ekranindan degistirilir.
dashboard.initial-admin-password=${DASHBOARD_INITIAL_ADMIN_PASSWORD:}

# Yalnızca REST API yollarını OpenAPI dokümantasyonuna dahil et
springdoc.paths-to-match=/api/**

# JWT Yapılandırması (İmzalama anahtarı ortam değişkeninden okunur)
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# Token'daki "roles" iddiası Spring yetkilerine ROLE_ önekiyle çevrilir (ör. APIUSER -> ROLE_APIUSER)
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
