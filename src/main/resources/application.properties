spring.application.name=Analysis Dashboard

# PostgreSQL baglantisi (Docker: gb-postgres, host portu 5435)
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5435}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dbAdmin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# JPA
# validate: ORM sema uretmez/degistirmez. Sema sahibi bu uygulama degil (APP-01 §2.4, §2.5)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# open-in-view=false: sablon render'inda gizli lazy sorgu (N+1) olusmasini engeller (WEB-01 §1.1)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Hata sayfasi bilgi sizdirmaz (WEB-02 §4.2)
server.error.include-stacktrace=never
server.error.include-message=never

# Yanit sikistirma (WEB-01 §4)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript

# Zaman dilimi sabit (WEB-03 §4.1)
spring.jackson.time-zone=Europe/Istanbul

# RFC 7807 ProblemDetail hata standardı
spring.mvc.problemdetails.enabled=true

# Yalnızca REST API yollarını OpenAPI dokümantasyonuna dahil et
springdoc.paths-to-match=/api/**


