spring.application.name=Analysis Dashboard

# PostgreSQL baglantisi (Docker: gb-postgres, host portu 5435). Parola yalnizca ortam degiskeninden okunur.
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5435}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
# validate: ORM semayi yalnizca kontrol eder, uretmez/degistirmez. Semayi Flyway migrasyonlari kurar
spring.jpa.hibernate.ddl-auto=validate
# open-in-view=false: sablon render'inda gizli lazy sorgu (N+1) olusmasini engeller
spring.jpa.open-in-view=false

# Hata sayfasi mesaj ve yigin izi sizdirmaz
server.error.include-stacktrace=never
server.error.include-message=never

# Yanit sikistirma
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript

# Pano tazeleme: veri alanlari 5 sn'de bir sunucudan yeniden cekilir.
# 3 aralik (15 sn) boyunca basarili yanit gelmezse ekran "Veriler guncel degil" diye isaretlenir.
# Aralik ekran sayisiyla carpilan bir yuktur (5 sn x 20 ekran = saniyede 4 istek); dusurmeden once hesaplayin.
dashboard.refresh.interval=5s
dashboard.refresh.stale-after-intervals=3

# Yalnızca REST API yollarını OpenAPI dokümantasyonuna dahil et
springdoc.paths-to-match=/api/**

# JWT Yapılandırması (İmzalama anahtarı ortam değişkeninden okunur)
jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
# Token'daki "roles" iddiası Spring yetkilerine ROLE_ önekiyle çevrilir (ör. APIUSER -> ROLE_APIUSER)
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_
