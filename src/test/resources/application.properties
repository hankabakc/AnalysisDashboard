spring.application.name=Analysis Dashboard

# PostgreSQL baglantisi (Docker: gb-postgres, host portu 5435)
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5435}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:dbAdmin}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Hata sayfasi bilgi sizdirmaz
server.error.include-stacktrace=never
server.error.include-message=never

# Yanit sikistirma
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript

# Zaman dilimi sabit
spring.jackson.time-zone=Europe/Istanbul

# RFC 7807 ProblemDetail hata standardı
spring.mvc.problemdetails.enabled=true

# Yalnızca REST API yollarını OpenAPI dokümantasyonuna dahil et
springdoc.paths-to-match=/api/**

# JWT Yapılandırması (Test ortamı)
jwt.secret=${JWT_SECRET:supersecretkeyforjwttestingenvironment1234567890}
jwt.expiration-seconds=3600
